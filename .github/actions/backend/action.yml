name: Install Django quality environment
description: Install the same CPU dependencies and QA tools used by the farm tests
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        cache: pip
        cache-dependency-path: |
          backend/requirements.txt
          scripts/quality-requirements.txt
    - shell: bash
      run: |
        python -m pip install --upgrade "setuptools>=84.1.0"
        python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
        python -m pip install -r backend/requirements.txt -r scripts/quality-requirements.txt
