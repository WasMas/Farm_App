sonar.sources=backend,frontend/lib
sonar.tests=backend,frontend/test
sonar.test.inclusions=backend/**/tests.py,backend/**/test_*.py,backend/core/quality_live.py,frontend/test/**
sonar.exclusions=backend/**/migrations/**,backend/**/tests.py,backend/**/test_*.py,backend/core/quality_live.py
sonar.python.version=3.14
sonar.python.coverage.reportPaths=reports/python.xml
sonar.dart.lcov.reportPaths=reports/flutter.info
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
